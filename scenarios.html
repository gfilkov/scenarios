<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenarios</title>

    <link rel="stylesheet" href="css/scenarios.css">
</head>
<body>

    <main class="gallery" id="gallery" aria-label="Scenario thumbnails"></main>

    <!-- Settings drawer, hidden by default -->
    <aside class="settings" id="settings" aria-hidden="true" aria-labelledby="settingsTitle">
        <header class="settings-header">
            <h2 id="settingsTitle">Scenario settings</h2>
            <button class="close-btn" id="closeSettings" aria-label="Close settings">×</button>
        </header>

        <div class="settings-body">
            <img id="settingsPreview" class="preview" alt="Selected scenario preview">

            <!-- read-only description -->
            <label class="field">
                <span>Description</span>
                <textarea id="txtDescription" rows="3" readonly placeholder="—"></textarea>
            </label>

            <label class="field">
                <span>Text</span>
                <textarea id="txtText" rows="3" placeholder="Short lines of text..."></textarea>
            </label>

            <label class="field">
                <span>Message</span>
                <input id="txtMessage" type="text" placeholder="Longer single-line message">
            </label>

            <label class="field">
                <span>Color</span>
                <input id="txtColor" type="color" value="#00ff88">
            </label>

            <div class="field radio-group" role="radiogroup" aria-labelledby="typeLabel">
                <span id="typeLabel">Type</span>
                <label><input type="radio" name="type" value="LED" checked> LED</label>
                <label><input type="radio" name="type" value="TTF"> TTF</label>
            </div>

            <div class="actions">
                <button id="btnPlay" class="primary">Play</button>
                <button id="btnCancel">Cancel</button>
            </div>
        </div>
    </aside>

    <div class="backdrop" id="backdrop" hidden></div>

    <script src="jsdebug/scenarios.js"></script>
</body>
</html>
